name : build and tests
on : [push]
jobs :
  build:
    runs-on: ubuntu-latest
    steps:
      - uses : actions/checkout@v6

      - name : Extract IDEA version for cache key
        run : grep -oE '<idea.version>[^<]+' formatter-core/pom.xml | sed 's/<idea.version>//' > idea-version.txt

      - name : Restore Intellij Idea artifact cache
        uses : actions/cache/restore@v6
        with :
          key : v1-idea-zip-${{ hashFiles('idea-version.txt') }}
          path : ~/.m2/repository/.cache/download-maven-plugin

      - name: Restore Maven artifacts cache
        uses: actions/cache/restore@v6
        with:
          key: v1-dependencies-${{ hashFiles('**/pom.xml') }}
          path: ~/.m2

      - name : Set up jdk 21 for x64
        uses : actions/setup-java@v5
        with :
          java-version: '21'
          distribution: temurin
          architecture: x64

      - name : Download and extract IntelliJ IDEA (must run before any invocation that compiles)
        run : ./mvnw -B generate-sources
        timeout-minutes: 15

      - name : build and test
        run : ./mvnw -B package

      - name: Cache Intellij IDEA artifact
        uses: actions/cache/save@v6
        with:
          key: v1-idea-zip-${{ hashFiles('idea-version.txt') }}
          path: ~/.m2/repository/.cache/download-maven-plugin

      - name: Cache Maven artifacts
        uses: actions/cache/save@v6
        with:
          key: v1-dependencies-${{ hashFiles('**/pom.xml') }}
          path: ~/.m2

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\..* ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          cp formatter-core/target/intellij-code-formatter.jar "formatter-core/target/intellij-code-formatter-${GITHUB_REF_NAME}.jar"
          # The plugin jar embeds the core, so it is a standalone asset too. Its filename
          # carries the pom version, which is not the tag until the poms get a shared parent.
          plugin_jar=$(find maven-plugin/target -maxdepth 1 -name 'intellij-code-formatter-maven-plugin-*.jar' \
            ! -name "*${GITHUB_REF_NAME}.jar" | head -1)
          if [[ -z "$plugin_jar" ]]; then
            echo "Plugin jar not found in maven-plugin/target"
            exit 1
          fi
          cp "$plugin_jar" "maven-plugin/target/intellij-code-formatter-maven-plugin-${GITHUB_REF_NAME}.jar"
          gh release create "$GITHUB_REF_NAME" \
            "formatter-core/target/intellij-code-formatter-${GITHUB_REF_NAME}.jar" \
            "maven-plugin/target/intellij-code-formatter-maven-plugin-${GITHUB_REF_NAME}.jar" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
