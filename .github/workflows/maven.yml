name : CI workflow (build, test, release)
on : [push]
jobs :
  build:
    runs-on: ubuntu-latest
    steps:
      - uses : actions/checkout@v6

      - name : Extract IDEA version for cache key
        run : grep -oE '<idea.version>[^<]+' formatter-core/pom.xml | sed 's/<idea.version>//' > idea-version.txt

      - name : Restore Intellij Idea artifact cache
        uses : actions/cache/restore@v6
        with :
          key : v1-idea-zip-${{ hashFiles('idea-version.txt') }}
          path : ~/.m2/repository/.cache/download-maven-plugin

      - name: Restore Maven artifacts cache
        uses: actions/cache/restore@v6
        with:
          key: v1-dependencies-${{ hashFiles('**/pom.xml') }}
          path: ~/.m2

      - name : Set up jdk 21 for x64
        uses : actions/setup-java@v5
        with :
          java-version: '21'
          distribution: temurin
          architecture: x64

      - name : Download and extract IntelliJ IDEA (must run before any invocation that compiles)
        run : ./mvnw -B generate-sources
        timeout-minutes: 15

      - name : build and test
        run : ./mvnw -B package

      - name: Cache Intellij IDEA artifact
        uses: actions/cache/save@v6
        with:
          key: v1-idea-zip-${{ hashFiles('idea-version.txt') }}
          path: ~/.m2/repository/.cache/download-maven-plugin

      - name: Cache Maven artifacts
        uses: actions/cache/save@v6
        with:
          key: v1-dependencies-${{ hashFiles('**/pom.xml') }}
          path: ~/.m2

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\..* ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          cp formatter-core/target/intellij-code-formatter.jar "formatter-core/target/intellij-code-formatter-${GITHUB_REF_NAME}.jar"
          # The plugin jar embeds the core, so it is a standalone asset too. Its filename
          # already carries the tag ('make release' sets the reactor's revision to the tag
          # before tagging), so it needs no renaming, only a presence check.
          plugin_jar="maven-plugin/target/intellij-code-formatter-maven-plugin-${GITHUB_REF_NAME}.jar"
          if [[ ! -f "$plugin_jar" ]]; then
            echo "Plugin jar not found at $plugin_jar - was the release cut with 'make release NEW_VERSION=...'?"
            exit 1
          fi
          # Idempotent: a re-run (e.g. after a later step like the Central deploy
          # failed) must not fail here just because the release already exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, re-uploading assets"
            gh release upload "$GITHUB_REF_NAME" \
              "formatter-core/target/intellij-code-formatter-${GITHUB_REF_NAME}.jar" \
              "maven-plugin/target/intellij-code-formatter-maven-plugin-${GITHUB_REF_NAME}.jar" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "formatter-core/target/intellij-code-formatter-${GITHUB_REF_NAME}.jar" \
              "maven-plugin/target/intellij-code-formatter-maven-plugin-${GITHUB_REF_NAME}.jar" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name : Set up jdk 21 for deployment to Sonatype Central
        if: github.ref_type == 'tag'
        uses : actions/setup-java@v5
        with :
          java-version: '21'
          distribution: temurin
          architecture: x64
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name : Deploy to Sonatype Central
        if: github.ref_type == 'tag'
        run: |
          # Retries here guard against transient upload failures. Credentials,
          # namespace verification, and stale/failed portal deployments were all
          # ruled out as causes of the 401 this used to hit on every attempt (that
          # 401 came from the ignorePublishedComponents pre-check, removed in pom.xml).
          for attempt in 1 2 3; do
            if ./mvnw -B deploy -DskipTests; then
              exit 0
            fi
            echo "Deploy attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          exit 1
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
