name : build and tests
on : [push, workflow_call]
jobs :
  build:
    runs-on: ubuntu-latest
    steps:
      - uses : actions/checkout@v6

      - name : Extract IDEA version for cache key
        run : grep -oE '<idea.version>[^<]+' pom.xml | sed 's/<idea.version>//' > /tmp/idea-version.txt

      - name : Restore Intellij Idea artifact cache
        uses : actions/cache/restore@v6
        with :
          key : v1-idea-zip-{{ checksum "/tmp/ide-version.txt" }}
          path : ~/.m2/repository/.cache/download-maven-plugin

      - name: Restore Maven artifacts cache
        uses: actions/cache/restore@v6
        with:
          key: v1-dependencies-{{ checksum "pom.xml" }}
          path: ~/.m2

      - name : Set up open-jdk 21 for x64
        uses : actions/setup-java@v5
        with :
          java-version: '21'
          distribution: temurin
          architecture: x64
          cache-jdk: true

      - name : Download and extract IntelliJ IDEA (must run before any invocation that compiles)
        run : ./mvnw -B generate-sources
        timeout-minutes: 15

      - name : build and test
        run : ./mvnw -B package

      - name: Cache Intellij IDEA artifact
        uses: actions/cache/save@v6
        with:
          key: v1-idea-zip-{{ checksum "/tmp/ide-version.txt" }}

      - name: Cache Maven artifacts
        uses: actions/cache/save@v6
        with:
          key: v1-dependencies-{{ checksum "pom.xml" }}